name: Build Executable

on:
  push:
    branches:
      - main     # Tự động build mỗi khi push code lên nhánh main
  workflow_dispatch: # Cho phép bấm nút chạy thủ công

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --noconsole --onefile --name="RF_Design_Tool" RF.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RF_Design_Tool_Windows
        path: dist/RF_Design_Tool.exe
